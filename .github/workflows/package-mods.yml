name: Package RuneScape Addons

on:
  workflow_dispatch:
  push:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      mods: ${{ steps.find.outputs.mods }}
      run_due: ${{ steps.schedule.outputs.run_due }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Find addon folders
        id: find
        shell: bash
        run: |
          mods=$(for manifest in */plugin.json; do
            if [[ -f "$manifest" ]]; then
              dirname "$manifest"
            fi
          done | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "mods=$mods" >> "$GITHUB_OUTPUT"

      - name: Check 89-day schedule
        id: schedule
        shell: bash
        run: |
          day=$(( $(date -u +%s) / 86400 ))
          if (( day % 89 == 0 )); then
            echo "run_due=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_due=false" >> "$GITHUB_OUTPUT"
          fi

  package:
    needs: discover
    if: ${{ needs.discover.outputs.mods != '[]' && (github.event_name != 'schedule' || needs.discover.outputs.run_due == 'true') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mod: ${{ fromJSON(needs.discover.outputs.mods) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Upload addon artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.mod }}
          path: ${{ matrix.mod }}/
          retention-days: 90
